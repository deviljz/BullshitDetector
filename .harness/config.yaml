# harness-core config
project: BullshitDetector

# 只有白名单内的文件改动才触发 on-edit 检查；其它路径 CLI 侧直接 ignore，
# 根本不进 pytest。覆盖 docs/README/CHANGELOG/config 等非项目代码场景。
trigger_on_edit_paths:
  - "src/**/*.py"

llm:
  provider: claude_agent  # claude_agent | manual

ignore_paths_global:
  - .git/**
  - "**/__pycache__/**"
  - "**/node_modules/**"
  - "**/*.log"
  - "**/.pytest_cache/**"
  - reports/**

circuit_breaker:
  max_retries: 3
  same_error_limit: 2

incremental_cache:
  enabled: true
  debounce_seconds: 30

plan:
  spec_dir: docs/tasks
  require_complexity_field: true

execute:
  complexity_source: spec_field

review:
  enabled: true
  focus: [api_contract, error_handling, prompt_rules]

targets:
  - name: backend
    root: src/
    language: python
    test_paths: [tests/]
    ignore_paths:
      - "**/*.pyc"
      - "**/__pycache__/**"
      # UI 测试会弹 Qt 窗口抢焦点，兜底防线（主过滤已移到 trigger_on_edit_paths）
      - "tests/ui_*.py"
      - "tests/dialog_*.py"
      - "tests/unified_input*.py"
      - "tests/result_window_test.py"
      - "tests/loading_overlay_test.py"
      - "tests/stamp_*.py"
      - "tests/chat_*.py"
      - "tests/force_show_test.py"
      - "tests/mode_btn_*.py"
      - "tests/startup_opacity_test.py"
      - "tests/fullscreen_*.py"
      - "tests/self_test.py"
      - "tests/flutter_*.py"
      - "tests/python_ref_capture.py"
      # 会实际调 LLM API 消耗配额的重放脚本
      - "tests/replay_*.py"
      # 非自动化测试脚本（手动跑 / 生成 fixture 用）
      - "tests/generate_*.py"
      - "tests/capture_*.py"
      - "tests/accuracy_*.py"
      - "tests/run_*.py"
      - "tests/compare_models.py"
      - "tests/saucenao_test.py"
      - "tests/usage_window*.py"
    core_modules:
      - ai.analyzer
      - ai.providers.openai_compat
      - ai.providers.classic_mixin
      - ai.providers.plan_mixin
      - ai.tools
      - ai.json_utils
      - hotkey_win32
    checks:
      assertion_ast:
        forbid_tautology: true

gate:
  require_evidence: true
  evidence_source: harness_report
  max_age_seconds: 300
